spring.application.name=backend

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/memory_grove
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/db.changelog-master.xml

# JWT Configuration
jwt.secret-key=your-very-secure-and-long-secret-key-for-jwt-encoding-minimum-256-bits
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# Telegram Bot Configuration
telegram.bot.username=MemoryGroveBot
telegram.bot.token=8725184126:AAE9cJgdvJnUB2szIPmWJMzuHmhxQ8AHnnU

# File Storage Configuration (????? ?????????)
file.storage.max-file-size=10485760
file.storage.allowed-types=image/jpeg,image/png,image/gif,image/webp
file.storage.thumbnail-size=300

# Logging
logging.level.com.memorygrove=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.io.jsonwebtoken=DEBUG